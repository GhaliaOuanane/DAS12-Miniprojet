<h1>Liste des conférences</h1>


<div class="container">
    @for(conf of confList;track conf.id){
        @if(conf.nbPlaces>0){
    <div class="card" style="width: 18rem;">
    <img src="{{conf.imageUrl}}" class="card-img-top" alt="conf_image">
    <div class="card-body">
        <h5 class="card-title">{{conf.titre|uppercase}}</h5>
        <p class="card-text">{{conf.category}}</p>
        <a href="#" class="btn btn-primary">add to favorite</a>
    </div>
    </div>
   } }@empty {
        <h2>aucune conférence n'est disponible pour le moment</h2>
    }
</div>
